name: CPU validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest torch

      - name: Compile Python sources
        run: python -m compileall python scripts tests

      - name: Run Python and result-integrity tests
        run: pytest -q

      - name: Compile CPU reference test
        run: >-
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror
          -Iinclude src/cpu_softmax.cpp tests/cpu_softmax_test.cpp
          -o cpu_softmax_test

      - name: Run CPU reference test
        run: ./cpu_softmax_test
