name: CPU validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest torch

      - name: Run Python tests
        run: pytest -q

      - name: Compile CPU reference test
        run: >-
          g++ -std=c++17 -Wall -Wextra -Wpedantic
          -Iinclude src/cpu_softmax.cpp tests/cpu_softmax_test.cpp
          -o cpu_softmax_test

      - name: Run CPU reference test
        run: ./cpu_softmax_test
